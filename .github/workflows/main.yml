name: Build Raphael 5.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git wget curl bc bison flex cpio \
            build-essential zip unzip rsync \
            libssl-dev libelf-dev

      - name: Clone kernel
        run: |
          git clone --depth=1 https://github.com/Nyako-mini/raphael5-4-resukisu.git kernel

      - name: Download toolchains
        run: |
          mkdir toolchains
          cd toolchains

          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/llvm-arm-toolchain-ship-10.0.9.tar.gz
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/aarch64-linux-android-4.9-Linux-5.4.tar.gz

          tar -xf llvm-arm-toolchain-ship-10.0.9.tar.gz
          tar -xf aarch64-linux-android-4.9-Linux-5.4.tar.gz

      - name: Find toolchains
        run: |
          echo "=== CLANG ==="
          find $GITHUB_WORKSPACE/toolchains -type f -name clang

          echo "=== LLD ==="
          find $GITHUB_WORKSPACE/toolchains -type f -name ld.lld

          echo "=== GCC ==="
          find $GITHUB_WORKSPACE/toolchains -type f -name aarch64-linux-android-gcc

      - name: Set build info
        run: |
          echo "KBUILD_BUILD_USER=voxelsy" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=ubuntu" >> $GITHUB_ENV
          echo "LOCALVERSION=-qgki" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          export CLANG=$(find $GITHUB_WORKSPACE/toolchains -type f -name clang | head -n1)

          if [ -z "$CLANG" ]; then
            echo "clang not found"
            exit 1
          fi

          export CLANG_DIR=$(dirname "$CLANG")
          export PATH=$CLANG_DIR:$PATH

          echo "Using clang:"
          which clang
          clang --version

          cd kernel

          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 302/' Makefile || true

          mkdir -p out

          make O=out ARCH=arm64 raphael_defconfig

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raphael-kernel
          if-no-files-found: warn
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/*.dtb
            kernel/out/arch/arm64/boot/*.img
