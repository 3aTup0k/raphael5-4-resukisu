name: CI Build Kernel for raphael

on:
  workflow_dispatch:
    inputs:
      BUILD_CONFIG:
        description: 'Build config file path'
        required: true
        default: 'build.config.raphael'
      LTO:
        description: 'LTO mode'
        required: true
        default: 'full'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: kernel

    - name: Set up build dependencies
      run: |
        sudo apt update
        sudo apt install -y git ccache flex bison libssl-dev libelf-dev bc kmod

    - name: Build kernel
      run: |
        cd kernel
        # Set up toolchain path
        export PATH=$(pwd)/../clang/bin:$PATH
        export LD_LIBRARY_PATH=$(pwd)/../clang/lib:$LD_LIBRARY_PATH
        
        # Create out directory
        mkdir -p out
        
        # Use default GKI config if specific one not found
        if [ -f arch/arm64/configs/${BUILD_CONFIG%.*}_defconfig ]; then
          DEFCONFIG=${BUILD_CONFIG%.*}_defconfig
        else
          DEFCONFIG=gki_defconfig
        fi
        
        # Build the kernel
        make O=out ARCH=arm64 $DEFCONFIG
        make O=out ARCH=arm64 -j$(nproc) \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          CROSS_COMPILE=aarch64-linux-gnu-
        
        # Copy compiled images
        mkdir -p ../artifact
        cp out/arch/arm64/boot/Image ../artifact/
        cp out/arch/arm64/boot/Image.gz ../artifact/ 2>/dev/null || true
        cp out/vmlinux ../artifact/ 2>/dev/null || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-images
        path: artifact/
