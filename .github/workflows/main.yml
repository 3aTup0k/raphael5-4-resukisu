name: Build GKI 5.4 Kernel for raphael (build.sh)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: kernel

      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          repository: android/kernel-build-tools
          path: build-tools

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential libssl-dev libelf-dev kmod cpio

      - name: Build kernel with build.sh
        run: |
          cd kernel
          # Используем официальный скрипт сборки
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          # Копируем результаты в папку для артефактов
          mkdir -p ../final_artifacts
          cp out/android-5.4/dist/Image ../final_artifacts/ 2>/dev/null || true
          cp out/android-5.4/dist/Image.gz ../final_artifacts/ 2>/dev/null || true
          cp out/android-5.4/dist/vmlinux ../final_artifacts/ 2>/dev/null || true
          # Копируем модули, если они есть
          if [ -d out/android-5.4/dist/modules ]; then
            cp -r out/android-5.4/dist/modules ../final_artifacts/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raphael-gki-5.4
          path: final_artifacts/
