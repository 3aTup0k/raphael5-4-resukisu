name: Build GKI 5.4 Kernel for Raphael

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: kernel

      - name: Set up build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache flex \
            libssl-dev libelf-dev kmod cpio \
            binutils-aarch64-linux-gnu

      - name: Install LLVM toolchain (Clang, LLD, etc.)
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.7/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          echo "$(pwd)/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04/bin" >> $GITHUB_PATH

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p out
          if [ -f arch/arm64/configs/raphael_defconfig ]; then
            DEFCONFIG=raphael_defconfig
          else
            DEFCONFIG=gki_defconfig
          fi
          make O=out ARCH=arm64 $DEFCONFIG

      - name: Build kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Collect artifacts
        run: |
          mkdir -p final_artifacts
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz final_artifacts/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image final_artifacts/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img final_artifacts/
          fi
          cp kernel/out/vmlinux final_artifacts/ 2>/dev/null || true
          echo "Сборка завершена" > final_artifacts/build_info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raphael-kernel-5.4-gki
          path: final_artifacts/
