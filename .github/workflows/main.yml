name: Build GKI 5.4 Kernel for Raphael

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: kernel

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential ccache \
            libssl-dev libelf-dev kmod cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang-15 lld-15
          # Создаём ссылки, чтобы make находил clang и llvm-утилиты
          sudo ln -sf /usr/bin/clang-15   /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-15  /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-15 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-15 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-15 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-15 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-15 /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-15 /usr/bin/llvm-strip

      - name: Fix missing min-tool-version.sh
        run: |
          cd kernel
          # Создаём заглушку, чтобы обойти проверку версии ассемблера
          mkdir -p scripts
          cat > scripts/min-tool-version.sh << 'EOF'
          #!/bin/sh
          # This is a dummy script to bypass the assembler version check
          echo 0
          EOF
          chmod +x scripts/min-tool-version.sh

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p out
          if [ -f arch/arm64/configs/raphael_defconfig ]; then
            DEFCONFIG=raphael_defconfig
          else
            DEFCONFIG=gki_defconfig
          fi
          make O=out ARCH=arm64 $DEFCONFIG

      - name: Build kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Collect artifacts
        run: |
          mkdir -p final_artifacts
          cp kernel/out/arch/arm64/boot/Image final_artifacts/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz final_artifacts/ 2>/dev/null || true
          cp kernel/out/vmlinux final_artifacts/ 2>/dev/null || true
          echo "Build completed" > final_artifacts/build_info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raphael-kernel-5.4
          path: final_artifacts/
